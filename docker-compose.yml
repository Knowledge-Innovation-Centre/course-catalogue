version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MEILISEARCH_HOST: ${VITE_MEILISEARCH_HOST}
        VITE_MEILISEARCH_KEY: ${VITE_MEILISEARCH_KEY}
        VITE_MEILISEARCH_INDEX: ${VITE_MEILISEARCH_INDEX:-ql_courses}
    healthcheck:
      test: [ "CMD", "wget", "-O/dev/null" , "-q", "http://localhost:3000" ]
    environment:
      - NODE_ENV=production
    restart: unless-stopped

