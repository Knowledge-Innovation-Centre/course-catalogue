version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MEILISEARCH_HOST: ${VITE_MEILISEARCH_HOST}
        VITE_MEILISEARCH_KEY: ${VITE_MEILISEARCH_KEY}
        VITE_MEILISEARCH_INDEX: ${VITE_MEILISEARCH_INDEX:-ql_courses}
    ports:
      - "3939:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    container_name: course-catalogue-frontend
