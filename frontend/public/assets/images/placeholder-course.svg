<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="225" fill="url(#bg-gradient)"/>

  <!-- Book/Education Icon -->
  <g transform="translate(200, 112.5)">
    <!-- Book -->
    <rect x="-35" y="-25" width="70" height="50" rx="4" fill="#d1d5db" opacity="0.6"/>
    <rect x="-35" y="-25" width="35" height="50" rx="4" fill="#d1d5db" opacity="0.4"/>
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#9ca3af" stroke-width="2" opacity="0.5"/>

    <!-- Pages detail -->
    <line x1="-20" y1="-15" x2="-10" y2="-15" stroke="#9ca3af" stroke-width="1.5" opacity="0.4"/>
    <line x1="-20" y1="-5" x2="-10" y2="-5" stroke="#9ca3af" stroke-width="1.5" opacity="0.4"/>
    <line x1="-20" y1="5" x2="-10" y2="5" stroke="#9ca3af" stroke-width="1.5" opacity="0.4"/>

    <line x1="10" y1="-15" x2="20" y2="-15" stroke="#9ca3af" stroke-width="1.5" opacity="0.4"/>
    <line x1="10" y1="-5" x2="20" y2="-5" stroke="#9ca3af" stroke-width="1.5" opacity="0.4"/>
    <line x1="10" y1="5" x2="20" y2="5" stroke="#9ca3af" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>
